# Dependabot keeps dependencies and CI actions patched, opening a PR per update
# that runs through the full CI gate before you merge. This is the automated half
# of the security story: the CI `audit` job *blocks* on known advisories;
# Dependabot *fixes* them (and routine version drift) without manual tracking.
version: 2
updates:
  # Application + tooling dependencies (Dependabot's "npm" ecosystem reads the
  # pnpm-lock.yaml). Grouped so a quiet week is one PR, not a dozen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    # Take minor + patch automatically; skip MAJOR bumps. Major upgrades of the
    # tooling (e.g. ESLint 10, TypeScript 6) routinely outrun the Next/eslint
    # ecosystem and break `pnpm lint`/`build`, which isn't worth babysitting on a
    # portfolio. Do those by hand when the ecosystem catches up. This does NOT
    # weaken security: Dependabot *security* updates ignore this filter, so a
    # vulnerable package still gets a fix PR even when the fix is a major bump.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The GitHub Actions used in the workflows above. We DO take action majors here
  # (e.g. cache v4 → v5): they're GitHub-maintained and are usually the fix for
  # runner/Node-version deprecations, so they're safe and worth keeping current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
